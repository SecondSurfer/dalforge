name: user  # entity name, should be singular, snake cased.
version: v1
columns:
  status:
    type: varchar # supported types are: int8, int32, int64, bool, varchar, text, float, date, time, datetime, uid, json
    allowNull: true
  uid:
    type: uid
    prefix: user
    unique: true
  email:
    type: varchar
    allowNull: false
    unique: true
  birthdate:
    type: date
    allowNull: true
  age:
    type: int8
  meta:
    type: json
    allowNull: true
operations:
  write: true   # if true will generate proper write functions
  delete: true  # if true it will generate delete functions
  softDelete: true # if true it will generate deleted_at column and use that one for all soft delete queries. to really delete record HardDelete should be called.
  gets:
    - email   # put a column name here; it will generate GetByEmail function. The intention is that those columns are unique values.
    - uid

  getsBulk:   # Generate GetByUids and GetByIds with in-memory cache checks
    - uid
    
  updatesBulk: # Generate surgical bulk partial updates using IN (...)
    - name: update_status_by_uids
      set: 
        - status
      whereIn: uid
    - name: update_age_by_ids
      set:
        - age
      whereIn: id

  upsertsBulk:
    - name: upsert_user_snapshots
      conflictTarget: uid
      updateColumns:
        - status
        - meta
      increment: false

  lists:
    - name: list_by_id                 # name of a function that will fetch multiple rows with pagination supported. This should be snake cased and have a name that sounds like multiple results are expected.
    - name: list_by_bday
      where: birthdate < :birthdate    # you can use named parameters. This will create a ListByBDay(ctx, birthdate time.Time, startId int64, pageSize int) function
      order: birthdate
      descending: true
    - name: list_by_age
      where: age = :minAge OR age > :minAge
      order: created
      typeMapping:
        minAge: age
     # descending: true   # default is false
    - name: list_by_status
      where: status = :status
      order: created
  deletes: 
    - name: delete_older
      where: age > :age
circuitbreaker:
  timeoutSeconds: 20             # how long to wait while in open state before trying to go to half open state.
  consecutiveFailures: 4         # how many times to fail in an closed state before we swithc to open state
caching:
  type: memory # Currently supported is memory + pub/sub redis
  # singleExpirationSeconds controls the TTL (Time-To-Live) for individual row caches (L1 local memory).
  # - Caching Mechanism: Point-reads (e.g., GetByID, GetByMatchUid) store the pure Go struct in local memory. Subsequent reads return in ~O(1) time without hitting MySQL.
  # - Passive Eviction: The item is automatically purged from memory when this TTL expires, or if the cache reaches the capacity defined by 'maxItemsCount'.
  # - Active Invalidation: Any 'Update' or 'Delete' operation immediately removes the entity from the local pod's cache AND fires an asynchronous Redis Pub/Sub event. This broadcasts the exact cache key to all peer pods, instantly invalidating their local copies to prevent stale data.
  singleExpirationSeconds: 300  
  listExpirationSeconds: 60     # timeout for local cache for multiple rows aka list functions
  # listInvalidation controls how paginated lists and count queries are invalidated during writes:
  # - flush:  Actively clears local list caches and broadcasts a Pub/Sub invalidation to all peer pods on every write. Safest for strict consistency, but can cause cache stampedes on high-write entities.
  # - expire: Ignores writes and relies purely on 'listExpirationSeconds' (TTL). Ideal for high-write tables where eventual consistency is acceptable.
  # - epoch:  Bumps a global atomic timestamp on writes; list queries checking the cache with an older epoch are rejected. A balanced hybrid approach.
  listInvalidation: epoch       
  maxItemsCount: 100000         # max number of items in cache
